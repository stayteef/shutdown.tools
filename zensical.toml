[project]
site_name = "Shutdown.Tools"
site_url = "https://shutdown.tools"
extra_css = ["assets/stylesheets/custom.css"]

nav = [
  { "Home" = "index.md" },
  { "Shutdown Tools" = "shutdown-tools.md" },
]

[project.theme]
name = "material"
features = [
  "toc.integrate",
  "content.tooltips",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "pink"

[[project.theme.palette]]
scheme = "slate"
primary = "deep orange"
accent = "lime"

[project.markdown_extensions.toc]
toc_depth = "2"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.details]  

[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs"]
auto_append = ["includes/glossary.md"]

[project.plugins.search]
[project.plugins.tags]
[project.plugins.offline]

[project.extra]
polyfills = ["js/iframe-worker-shim.js"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/stayteef/shutdown.tools"